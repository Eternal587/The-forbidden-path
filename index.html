<Title>The Forbidden Path</Title>

<style>
  .body {
    background-color: black;
    color: white;
    width: 100%;
    height: 100%;
  }

  .buttonsDiv {
    justify-self: center;
    justify-content: center;
    position: fixed;
  }

  .buttons {
    justify-self: center;
    outline-width: 0px;
    outline-color: black;
  }
</style>

<body class="body">
  <center>
  <h1>The Forbidden Path began with Slander Part 1</h1>
  <br>
  <div class="buttons">
    <button class="buttons" id="button1"><image id="buttonImage1" src="HOG.png"></image></button>
    <button class="buttons" id="button2"><image id="buttonImage2" src="DMR.png"></image></button>
    <button class="buttons" id="button3"><image id="buttonImage3" src="PEABODY.png"></image></button>
  </div>
  </center>
</body>

 

<script>
const images = ["PEABODY.png", "DMR.png", "HOG.png"]
const button1 = document.getElementById("button1")
let button1index = 2
const button2 = document.getElementById("button2")
let button2index = 1
const button3 = document.getElementById("button3")
let button3index = 0

const button1Image = document.getElementById("buttonImage1")
const button2Image = document.getElementById("buttonImage2")
const button3Image = document.getElementById("buttonImage3")

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// If your trying to cheat right now, I will find out
async function checkSlanderStatus() {
  if (button1index == 0 && button2index == 1 && button3index == 2) {
      var audio = new Audio('exit.mp3');
      audio.play();

      await sleep(5000)

      document.location.href = "riddlemethis.html"
  }
}

button1.addEventListener("click", function() {
  button1index += 1
  if (button1index > 2) {
    button1index = 0
  }
  button1Image.src = images[button1index]
  checkSlanderStatus()
})
button2.addEventListener("click", function() {
  button2index += 1
  if (button2index > 2) {
    button2index = 0
  }
  button2Image.src = images[button2index]
  checkSlanderStatus()
})
button3.addEventListener("click", function() {
  button3index += 1
  if (button3index > 2) {
    button3index = 0
  }
  button3Image.src = images[button3index]
  checkSlanderStatus()
})


// Music
var audio = new Audio('Darkness Falls.mp3');
audio.play();
if (navigator.getAutoplayPolicy(audio) == "disallowed" || navigator.getAutoplayPolicy(audio) == "allowed-muted") {
  alert("Please enable the ability to autoplay audio!")
  location.href = "index.html"
} else {
  audio.addEventListener("ended", function() {
    audio.play();
  })
}
</script>
